<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Stock" />
    <!-- Inter: se ve igual en Mac, Windows y Android, y trae cifras de ancho
         fijo (tabular) para que las columnas de plata queden alineadas sin
         tener que usar una tipografía de código. Si no carga (sin señal), cae
         a la del sistema y no se rompe nada. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <title>Control de Stock y Cuenta Corriente</title>
    <script>
      // Aplica el tema guardado antes de pintar, así no parpadea con el
      // tema equivocado al cargar (localStorage se lee sincrónico).
      (function () {
        var t = localStorage.getItem("cs_tema");
        if (t === "claro") document.documentElement.setAttribute("data-theme", "light");
        else if (t === "oscuro") document.documentElement.setAttribute("data-theme", "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
